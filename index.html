<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5fb" />
  <title>TAK Duty Control</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="menu">☰</button>
      <h1 id="pageTitle">خانه</h1>
      <button class="icon-btn" id="notifBtn" aria-label="notifications">💡</button>
    </header>

    <main id="view" class="view"></main>

    <button id="fab" class="fab" aria-label="add">＋</button>

    <nav class="bottom-nav">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>خانه</small></button>
      <button data-page="tasks" class="nav-item"><span>☑</span><small>وظایف</small></button>
      <button data-page="reports" class="nav-item"><span>▣</span><small>گزارش من</small></button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <section id="quickSheet" class="quick-sheet" aria-hidden="true">
    <form id="quickForm" autocomplete="off">
      <input id="quickTitle" class="quick-title" placeholder="چه کاری باید انجام شود؟" />
      <textarea id="quickDesc" class="quick-desc" placeholder="توضیحات" rows="2"></textarea>
      <div class="quick-tools">
        <button type="button" id="pickDate" class="tool-btn">📅<span id="dateLabel">امروز</span></button>
        <button type="button" id="pickPerson" class="tool-btn">🚩<span id="personLabel">محمدرضا</span></button>
        <button type="button" id="pickTime" class="tool-btn">⏰<span id="timeLabel">بدون ساعت</span></button>
        <button type="submit" class="send-btn">ثبت</button>
      </div>
      <div id="pickers" class="pickers hidden">
        <label>تاریخ<input id="dateInput" type="date"></label>
        <label>ساعت<input id="timeInput" type="time"></label>
        <label>مسئول<input id="personInput" type="text" placeholder="نام مسئول"></label>
      </div>
    </form>
  </section>

  <template id="emptyTpl"><div class="empty">چیزی ثبت نشده.</div></template>

  <script src="app.js"></script>
</body>
</html>
